<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Atlas of Human Emotion</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8f9fa; }
        #chart-container { position: relative; width: 1000px; height: 600px; margin: 20px auto; background: white; border: 1px solid #ddd; }
        .tooltip {
            position: absolute; text-align: center; padding: 6px; font-size: 12px; background: rgba(0,0,0,0.8);
            color: #fff; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }
        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative;
        }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; font-weight: bold; }
        .emotion-title { margin-top: 0; color: #333; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .meta-tag { display: inline-block; padding: 4px 8px; background: #eee; border-radius: 12px; font-size: 12px; margin-right: 5px; margin-bottom: 10px;}
    </style>
</head>
<body>

<div id="chart-container"></div>
<div id="tooltip" class="tooltip"></div>

<!-- Modal -->
<div id="emotionModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modal-title" class="emotion-title">Emotion Name</h2>
        <div>
            <span class="meta-tag" id="modal-valence">Valence: </span>
            <span class="meta-tag" id="modal-intensity">Intensity: </span>
            <span class="meta-tag" id="modal-status">Status: </span>
        </div>
        <p id="modal-definition">Definition goes here.</p>
    </div>
</div>

<script>
    const width = 1000, height = 600;
    const margin = { top: 60, right: 40, bottom: 60, left: 60 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const svg = d3.select("#chart-container").append("svg")
        .attr("width", width)
        .attr("height", height);
    
    // Add hatched pattern for "Forgotten Nuances"
    svg.append("defs")
        .append("pattern")
        .attr("id", "crosshatch")
        .attr("width", 4).attr("height", 4)
        .attr("patternTransform", "rotate(45 0 0)")
        .attr("patternUnits", "userSpaceOnUse")
        .append("line")
        .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 4)
        .attr("stroke", "#444").attr("stroke-width", 2);

    const chart = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // Load CSV
    d3.csv("emotion_taxonomy.csv").then(data => {
        
        data.forEach(d => {
            // 1. Map Categorical Text to Coordinate Grid Percentages
            let vPos = d.Valence === 'Negative' ? 0.25 : (d.Valence === 'Positive' ? 0.75 : 0.5);
            let iPos = d.Intensity === 'High' ? 0.25 : (d.Intensity === 'Low' ? 0.75 : 0.5); 
            
            // 2. Apply Coordinates with Random Scatter (Prevents overlapping centers)
            d.x = (vPos * innerWidth) + (Math.random() * 60 - 30);
            d.y = (iPos * innerHeight) + (Math.random() * 60 - 30);
            d.r = 14; 
        });

        // 3. Resolve Overlaps using Force Simulation
        const simulation = d3.forceSimulation(data)
            .force("x", d3.forceX(d => d.x).strength(0.3))
            .force("y", d3.forceY(d => d.y).strength(0.3))
            .force("collide", d3.forceCollide(d => d.r + 2).iterations(4))
            .stop();

        // Run physics engine statically before rendering
        for (let i = 0; i < 150; ++i) simulation.tick();

        // 4. Render Interactive Points
        const points = chart.selectAll(".point")
            .data(data)
            .enter().append("g")
            .attr("transform", d => `translate(${d.x},${d.y})`)
            .style("cursor", "pointer");

        // Apply Taxonomy Status Styles (Solid, Hollow, Patterned)
        points.append("circle")
            .attr("r", d => d.r)
            .attr("fill", d => {
                if (d.Wheel_Status === 'Wheel_Baseline') return '#444';
                if (d.Wheel_Status === 'Forgotten_Nuance') return 'url(#crosshatch)';
                return '#fff'; // Beyond_Wheel (Hollow)
            })
            .attr("stroke", "#444")
            .attr("stroke-width", 2);

        // 5. Update Accessors for Tooltip & Modal based on exact CSV headers
        const tooltip = d3.select("#tooltip");
        
        points.on("mouseover", (event, d) => {
            tooltip.style("opacity", 1)
                   .html(`<strong>${d.Emotion_Term}</strong>`)
                   .style("left", (event.pageX + 10) + "px")
                   .style("top", (event.pageY - 20) + "px");
        }).on("mouseout", () => {
            tooltip.style("opacity", 0);
        }).on("click", (event, d) => {
            openModal(d);
        });
    });

    function openModal(data) {
        document.getElementById('modal-title').innerText = data.Emotion_Term;
        document.getElementById('modal-valence').innerText = "Valence: " + data.Valence;
        document.getElementById('modal-intensity').innerText = "Intensity: " + data.Intensity;
        document.getElementById('modal-status').innerText = "Status: " + data.Wheel_Status.replace('_', ' ');
        document.getElementById('modal-definition').innerText = data.Precise_Definition;
        document.getElementById('emotionModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('emotionModal').style.display = 'none';
    }
</script>
</body>
</html>
